

[[hooks.SessionStart]]
matcher = "startup|resume"

[[hooks.SessionStart.hooks]]
type = "command"
command = "pwsh -NoProfile -NonInteractive -Command \"Start-Process -WindowStyle Hidden -FilePath 'C:/Program Files/PowerShell/7/pwsh.exe' -ArgumentList '-NoProfile','-NonInteractive','-EncodedCommand','' -WorkingDirectory (Get-Location).Path -RedirectStandardOutput '.codex/jbcontext-index.stdout.log' -RedirectStandardError '.codex/jbcontext-index.stderr.log'\""
statusMessage = "jbcontext: indexing project"
timeout = 5
