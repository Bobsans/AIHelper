[package]
name = "ah-runtime"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plugin runtime and dynamic loader for AIHelper"
# Distributed as signed binaries, not on crates.io. Publishing would also
# require versioned path dependencies across the workspace.
publish = false

[dependencies]
ah-plugin-api = { path = "../ah-plugin-api" }
# For `OutputSink` alone: a built-in is told where its output goes, because it
# renders after parsing its own arguments and nothing above it could otherwise
# reach that decision.
ah-output = { path = "../ah-output" }
jsonschema = { version = "0.48.0", default-features = false }
libloading = "0.8.6"
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
