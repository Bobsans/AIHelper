[package]
name = "ah-updater-core"
version = "1.3.1"
edition = "2024"
publish = false

[dependencies]
ah-release-manifest = { path = "../ah-release-manifest" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "3"
