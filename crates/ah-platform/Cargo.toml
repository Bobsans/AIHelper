[package]
name = "ah-platform"
version = "2.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The platform-specific primitives AIHelper needs, behind one signature each"
# Distributed as signed binaries, not on crates.io. Publishing would also
# require versioned path dependencies across the workspace.
publish = false

[dependencies]

# flock, for the lease. The Windows half of the same primitive is a named
# mutex, which windows-sys below provides.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
