[package]
name = "ah-persist"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Writing AIHelper's JSON state files atomically, one writer at a time"
# Distributed as signed binaries, not on crates.io. Publishing would also
# require versioned path dependencies across the workspace.
publish = false

[dependencies]
ah-error = { path = "../ah-error" }
ah-platform = { path = "../ah-platform" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
