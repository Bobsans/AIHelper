[package]
name = "ah-observability"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AIHelper's event log: what happened, redacted, rotated, and readable after the fact"
# Distributed as signed binaries, not on crates.io. Publishing would also
# require versioned path dependencies across the workspace.
publish = false

[dependencies]
ah-config = { path = "../ah-config" }
ah-error = { path = "../ah-error" }
ah-mcp = { path = "../ah-mcp" }
ah-plugin-api = { path = "../ah-plugin-api" }
ah-redact = { path = "../ah-redact" }
ah-runtime = { path = "../ah-runtime" }
chrono.workspace = true
fs2.workspace = true
serde_json.workspace = true

# The log file is opened with O_NOFOLLOW, so a symlink planted at its path
# cannot redirect the write.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
