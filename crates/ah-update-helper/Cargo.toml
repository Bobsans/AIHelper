[package]
name = "ah-update-helper"
version = "1.3.0"
edition = "2024"
publish = false

[dependencies]
ah-updater-core = { path = "../ah-updater-core" }
serde_json = "1.0.140"
sha2 = "0.11"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
] }

[dev-dependencies]
ah-release-manifest = { path = "../ah-release-manifest" }
base64 = "0.22"
ed25519-dalek = "3"
tempfile = "3.20.0"
