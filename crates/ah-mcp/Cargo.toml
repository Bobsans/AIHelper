[package]
name = "ah-mcp"
version = "1.3.2"
edition = "2024"
description = "MCP stdio server for AIHelper typed commands"

[dependencies]
ah-plugin-api = { path = "../ah-plugin-api" }
ah-runtime = { path = "../ah-runtime" }
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1.0"
thiserror = "2.0"
tokio = { version = "1.52.1", features = ["io-std", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower-http = { version = "0.6", features = ["limit"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
