[package]
name = "ah-mcp"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP stdio server for AIHelper typed commands"
# Distributed as signed binaries, not on crates.io. Publishing would also
# require versioned path dependencies across the workspace.
publish = false

[dependencies]
ah-plugin-api = { path = "../ah-plugin-api" }
ah-redact = { path = "../ah-redact" }
ah-runtime = { path = "../ah-runtime" }
ah-setup-ui = { path = "../ah-setup-ui" }
axum.workspace = true
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower-http = { version = "0.6", features = ["limit"] }
uuid.workspace = true
