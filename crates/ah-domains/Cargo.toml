[package]
name = "ah-domains"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AIHelper's built-in command domains: file, search, ctx, git, project, run, http, task and secrets"
# Distributed as signed binaries, not on crates.io. Publishing would also
# require versioned path dependencies across the workspace.
publish = false

[features]
# The two snapshot corpora, for the CLI crate's golden snapshots. Off by
# default, so a release build compiles neither.
fixtures = []

[dependencies]
ah-config = { path = "../ah-config" }
ah-error = { path = "../ah-error" }
ah-mcp = { path = "../ah-mcp" }
ah-output = { path = "../ah-output" }
ah-platform = { path = "../ah-platform" }
ah-persist = { path = "../ah-persist" }
ah-plugin-api = { path = "../ah-plugin-api" }
ah-runtime = { path = "../ah-runtime" }
ah-secrets = { path = "../ah-secrets" }
clap = { workspace = true, features = ["string"] }
command-group.workspace = true
dialoguer = "0.12.0"
globset = "0.4.16"
ignore = "0.4.27"
regex = "1.11.1"
reqwest = { workspace = true, features = ["blocking", "json"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
shell-words.workspace = true
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
