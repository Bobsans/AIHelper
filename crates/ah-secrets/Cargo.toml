[package]
name = "ah-secrets"
version = "1.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AIHelper's secret vault: where credentials are kept and how they are resolved"
# Distributed as signed binaries, not on crates.io. Publishing would also
# require versioned path dependencies across the workspace.
publish = false

[dependencies]
aes-gcm = { workspace = true, features = ["aes"] }
ah-config = { path = "../ah-config" }
ah-error = { path = "../ah-error" }
ah-mcp = { path = "../ah-mcp" }
ah-persist = { path = "../ah-persist" }
ah-plugin-api = { path = "../ah-plugin-api" }
ah-runtime = { path = "../ah-runtime" }
fs2.workspace = true
keyring.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
