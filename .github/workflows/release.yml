name: Release Binaries

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            archive: ah-linux-x64.zip
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            archive: ah-windows-x64.zip
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            archive: ah-macos-arm64.zip

    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master
        with:
          toolchain: stable

      - name: Verify runner target
        shell: bash
        run: |
          actual="$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')"
          test "$actual" = "${{ matrix.target }}"

      - name: Build release binary
        run: |
          cargo build --release --locked --bin ah
          cargo build --release --locked -p ah-plugin-github
          cargo build --release --locked -p ah-plugin-gitlab
          cargo build --release --locked -p ah-plugin-ollama
          cargo build --release --locked -p ah-plugin-postgres

      - name: Build Windows service and update helpers
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked --bin ah-mcp-service
          cargo build --release --locked -p ah-update-helper

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "${{ matrix.archive }}"
          New-Item -ItemType Directory -Path "dist/plugins" -Force | Out-Null
          Copy-Item -LiteralPath "target/release/ah.exe" -Destination "dist/ah.exe" -Force
          Copy-Item -LiteralPath "target/release/ah-mcp-service.exe" -Destination "dist/ah-mcp-service.exe" -Force
          Copy-Item -LiteralPath "target/release/ah-update-helper.exe" -Destination "dist/ah-update-helper.exe" -Force
          Copy-Item -LiteralPath "target/release/ah_plugin_github.dll" -Destination "dist/plugins/ah-plugin-github.dll" -Force
          Copy-Item -LiteralPath "target/release/ah_plugin_gitlab.dll" -Destination "dist/plugins/ah-plugin-gitlab.dll" -Force
          Copy-Item -LiteralPath "target/release/ah_plugin_ollama.dll" -Destination "dist/plugins/ah-plugin-ollama.dll" -Force
          Copy-Item -LiteralPath "target/release/ah_plugin_postgres.dll" -Destination "dist/plugins/ah-plugin-postgres.dll" -Force
          Push-Location "dist"
          Compress-Archive -Path "ah.exe", "ah-mcp-service.exe", "ah-update-helper.exe", "plugins" -DestinationPath "..\$archive" -Force
          Pop-Location

      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/plugins
          cp "target/release/ah" "dist/ah"
          chmod +x "dist/ah"
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp "target/release/libah_plugin_github.so" "dist/plugins/ah-plugin-github.so"
            cp "target/release/libah_plugin_gitlab.so" "dist/plugins/ah-plugin-gitlab.so"
            cp "target/release/libah_plugin_ollama.so" "dist/plugins/ah-plugin-ollama.so"
            cp "target/release/libah_plugin_postgres.so" "dist/plugins/ah-plugin-postgres.so"
          else
            cp "target/release/libah_plugin_github.dylib" "dist/plugins/ah-plugin-github.dylib"
            cp "target/release/libah_plugin_gitlab.dylib" "dist/plugins/ah-plugin-gitlab.dylib"
            cp "target/release/libah_plugin_ollama.dylib" "dist/plugins/ah-plugin-ollama.dylib"
            cp "target/release/libah_plugin_postgres.dylib" "dist/plugins/ah-plugin-postgres.dylib"
          fi
          (
            cd dist
            zip -9 -r "../${{ matrix.archive }}" "ah" "plugins"
          )

      - name: Smoke test release archive
        run: python scripts/release_smoke.py "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  validate:
    name: Validate Release Archives
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master
        with:
          toolchain: stable

      - name: Download platform archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ah-*.zip
          path: release-archives
          merge-multiple: true

      - name: Validate exact archive set
        run: cargo run --locked -p ah-release-tool -- validate-archives --assets-dir release-archives

      - name: Upload validated archive set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: |
            release-archives/ah-linux-x64.zip
            release-archives/ah-macos-arm64.zip
            release-archives/ah-windows-x64.zip
          if-no-files-found: error

  sign:
    name: Sign Release Assets
    runs-on: ubuntu-latest
    needs:
      - validate
    if: github.event_name == 'release'
    environment:
      name: release-signing

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master
        with:
          toolchain: stable

      - name: Download validated archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-archives
          path: release-archives

      - name: Build internal release tool
        run: cargo build --release --locked -p ah-release-tool

      - name: Generate and sign release assets
        env:
          AIHELPER_RELEASE_ED25519_SEED_B64URL: ${{ secrets.AIHELPER_RELEASE_ED25519_SEED_B64URL }}
          AIHELPER_RELEASE_ED25519_PUBLIC_KEY_B64URL: ${{ vars.AIHELPER_RELEASE_ED25519_PUBLIC_KEY_B64URL }}
          AIHELPER_MINIMUM_UPDATER_VERSION: "1.2.0"
        run: |
          ./target/release/ah-release-tool sign-release \
            --assets-dir release-archives \
            --output-dir signed-release-assets \
            --repository "${{ github.repository }}" \
            --tag "${{ github.event.release.tag_name }}" \
            --minimum-updater-version "${{ env.AIHELPER_MINIMUM_UPDATER_VERSION }}"

      - name: Upload verified signed asset set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-assets
          path: |
            signed-release-assets/ah-linux-x64.zip
            signed-release-assets/ah-linux-x64.manifest.json
            signed-release-assets/ah-linux-x64.manifest.sig
            signed-release-assets/ah-macos-arm64.zip
            signed-release-assets/ah-macos-arm64.manifest.json
            signed-release-assets/ah-macos-arm64.manifest.sig
            signed-release-assets/ah-windows-x64.zip
            signed-release-assets/ah-windows-x64.manifest.json
            signed-release-assets/ah-windows-x64.manifest.sig
          if-no-files-found: error

  publish:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs:
      - sign
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download verified signed asset set
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: signed-release-assets
          path: release-assets

      - name: Require exact publishable set
        shell: bash
        run: |
          expected=(
            ah-linux-x64.zip
            ah-linux-x64.manifest.json
            ah-linux-x64.manifest.sig
            ah-macos-arm64.zip
            ah-macos-arm64.manifest.json
            ah-macos-arm64.manifest.sig
            ah-windows-x64.zip
            ah-windows-x64.manifest.json
            ah-windows-x64.manifest.sig
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset"
          done
          actual="$(find release-assets -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$actual" -eq "${#expected[@]}"

      - name: Upload assets to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-assets/ah-linux-x64.zip
            release-assets/ah-linux-x64.manifest.json
            release-assets/ah-linux-x64.manifest.sig
            release-assets/ah-macos-arm64.zip
            release-assets/ah-macos-arm64.manifest.json
            release-assets/ah-macos-arm64.manifest.sig
            release-assets/ah-windows-x64.zip
            release-assets/ah-windows-x64.manifest.json
            release-assets/ah-windows-x64.manifest.sig
          fail_on_unmatched_files: true
          overwrite_files: false
          preserve_order: true
