name: Release Binaries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade-acceptance:
    name: Upgrade and rollback Windows
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify signed installed update and rollback
        run: python scripts/upgrade_acceptance.py
