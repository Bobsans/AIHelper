[package]
name = "aihelper"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AIHelper CLI toolbox for AI agents and developers"
default-run = "ah"
# Distributed as signed binaries, not on crates.io. Publishing would also
# require versioned path dependencies across the workspace.
publish = false

[workspace]
members = [
    "crates/ah-mcp",
    "crates/ah-paths",
    "crates/ah-error",
    "crates/ah-platform",
    "crates/ah-plugin-api",
    "crates/ah-plugin-sdk",
    "crates/ah-redact",
    "crates/ah-setup-ui",
    "crates/ah-release-manifest",
    "crates/ah-release-tool",
    "crates/ah-runtime",
    "crates/ah-update-helper",
    "crates/ah-updater-core",
    "plugins/ah-plugin-github",
    "plugins/ah-plugin-gitlab",
    "plugins/ah-plugin-ollama",
    "plugins/ah-plugin-postgres",
]
resolver = "2"

# Package metadata shared by every workspace member.
#
# `version` is deliberately NOT inherited: the release workflow discovers and
# rewrites each manifest through `ah project version`, which reads a literal
# `version = "..."` from the `[package]` section. Hoisting it would require
# teaching that parser workspace inheritance first.
[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Bobsans/AIHelper"

# Single source of truth for every dependency used by more than one member.
# Members may add features on top with `features = [...]`; they must not
# override the version.
[workspace.dependencies]
assert_cmd = "2.0.17"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = "0.22"
clap = { version = "4.5.39", features = ["derive"] }
command-group = "5.0.1"
ed25519-dalek = "3"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
schemars = "1.2.2"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.11"
shell-words = "1.1.0"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = "1.52.1"
url = "2"
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
windows-sys = "0.61.2"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[dependencies]
aes-gcm = { version = "0.10.3", features = ["aes"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { workspace = true, features = ["string"] }
console = "0.16.4"
dialoguer = "0.12.0"
fs2 = "0.4.3"
globset = "0.4.16"
ignore = "0.4.27"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde_json"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2.185"
regex = "1.12.2"
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
shell-words.workspace = true
thiserror.workspace = true
walkdir = "2.5.0"
reqwest = { workspace = true, features = ["json"] }
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true
ah-paths = { path = "crates/ah-paths" }
ah-error = { path = "crates/ah-error" }
ah-platform = { path = "crates/ah-platform" }
ah-plugin-api = { path = "crates/ah-plugin-api" }
ah-redact = { path = "crates/ah-redact" }
ah-runtime = { path = "crates/ah-runtime" }
ah-mcp = { path = "crates/ah-mcp" }
ah-update-helper = { path = "crates/ah-update-helper" }
ah-updater-core = { path = "crates/ah-updater-core" }
tokio = { workspace = true, features = ["io-std", "rt-multi-thread", "time"] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
command-group.workspace = true

[dev-dependencies]
ah-release-manifest = { path = "crates/ah-release-manifest" }
assert_cmd.workspace = true
base64.workspace = true
command-group.workspace = true
ed25519-dalek.workspace = true
predicates = "3.1.3"

[[bin]]
name = "ah"
path = "src/main.rs"
