[package]
name = "aihelper"
version = "1.3.1"
edition = "2024"
description = "AIHelper CLI toolbox for AI agents and developers"
default-run = "ah"

[workspace]
members = [
    "crates/ah-mcp",
    "crates/ah-plugin-api",
    "crates/ah-release-manifest",
    "crates/ah-release-tool",
    "crates/ah-runtime",
    "crates/ah-update-helper",
    "crates/ah-updater-core",
    "plugins/ah-plugin-github",
    "plugins/ah-plugin-gitlab",
    "plugins/ah-plugin-ollama",
    "plugins/ah-plugin-postgres",
]
resolver = "2"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.39", features = ["derive", "string"] }
fs2 = "0.4.3"
globset = "0.4.16"
ignore = "0.4.27"
libc = "0.2.185"
regex = "1.12.2"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
shell-words = "1.1.0"
thiserror = "2.0.12"
walkdir = "2.5.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.11"
tempfile = "3.20.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
ah-plugin-api = { path = "crates/ah-plugin-api" }
ah-runtime = { path = "crates/ah-runtime" }
ah-mcp = { path = "crates/ah-mcp" }
ah-update-helper = { path = "crates/ah-update-helper" }
ah-updater-core = { path = "crates/ah-updater-core" }
tokio = { version = "1.52.1", features = ["io-std", "rt-multi-thread", "time"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
command-group = "5.0.1"

[dev-dependencies]
ah-release-manifest = { path = "crates/ah-release-manifest" }
assert_cmd = "2.0.17"
base64 = "0.22"
command-group = "5.0.1"
ed25519-dalek = "3"
predicates = "3.1.3"

[[bin]]
name = "ah"
path = "src/main.rs"
