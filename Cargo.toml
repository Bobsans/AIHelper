[package]
name = "aihelper"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AIHelper CLI toolbox for AI agents and developers"
default-run = "ah"
# Distributed as signed binaries, not on crates.io. Publishing would also
# require versioned path dependencies across the workspace.
publish = false

[workspace]
members = [
    "crates/ah-ai",
    "crates/ah-mcp",
    "crates/ah-observability",
    "crates/ah-output",
    "crates/ah-paths",
    "crates/ah-persist",
    "crates/ah-config",
    "crates/ah-domains",
    "crates/ah-error",
    "crates/ah-platform",
    "crates/ah-plugin-api",
    "crates/ah-plugin-sdk",
    "crates/ah-plugin-testkit",
    "crates/ah-redact",
    "crates/ah-secrets",
    "crates/ah-service",
    "crates/ah-setup-ui",
    "crates/ah-release-manifest",
    "crates/ah-release-tool",
    "crates/ah-runtime",
    "crates/ah-update-helper",
    "crates/ah-updater",
    "crates/ah-updater-core",
    "plugins/ah-plugin-github",
    "plugins/ah-plugin-gitlab",
    "plugins/ah-plugin-ollama",
    "plugins/ah-plugin-postgres",
]
resolver = "2"

# Package metadata shared by every workspace member.
#
# `version` is deliberately NOT inherited: the release workflow discovers and
# rewrites each manifest through `ah project version`, which reads a literal
# `version = "..."` from the `[package]` section. Hoisting it would require
# teaching that parser workspace inheritance first.
[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Bobsans/AIHelper"

# Single source of truth for every dependency used by more than one member.
# Members may add features on top with `features = [...]`; they must not
# override the version.
[workspace.dependencies]
aes-gcm = { version = "0.10.3", features = ["aes"] }
assert_cmd = "2.0.17"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.39", features = ["derive"] }
command-group = "5.0.1"
ed25519-dalek = "3"
fs2 = "0.4.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2.185"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
schemars = "1.2.2"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.11"
shell-words = "1.1.0"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = "1.52.1"
url = "2"
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
windows-sys = "0.61.2"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[dependencies]
clap = { workspace = true, features = ["string"] }
console = "0.16.4"
dialoguer = "0.12.0"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde_json"] }
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { workspace = true, features = ["json"] }
tempfile.workspace = true
ah-ai = { path = "crates/ah-ai" }
ah-observability = { path = "crates/ah-observability" }
ah-output = { path = "crates/ah-output" }
ah-paths = { path = "crates/ah-paths" }
ah-persist = { path = "crates/ah-persist" }
ah-config = { path = "crates/ah-config" }
ah-domains = { path = "crates/ah-domains" }
ah-error = { path = "crates/ah-error" }
ah-platform = { path = "crates/ah-platform" }
ah-plugin-api = { path = "crates/ah-plugin-api" }
ah-redact = { path = "crates/ah-redact" }
ah-secrets = { path = "crates/ah-secrets" }
ah-service = { path = "crates/ah-service" }
ah-runtime = { path = "crates/ah-runtime" }
ah-mcp = { path = "crates/ah-mcp" }
ah-update-helper = { path = "crates/ah-update-helper" }
ah-updater = { path = "crates/ah-updater" }
ah-updater-core = { path = "crates/ah-updater-core" }
tokio = { workspace = true, features = ["io-std", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
# Only `ah-mcp-service.rs` reaches for these now: it spawns the served process
# into a job object so a killed service takes its children with it.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
# The in-process command harness. A dev-dependency on this package below turns
# it on for tests only, so a release build compiles none of it - the same
# arrangement as `ah-domains/fixtures`.
harness = []

[dev-dependencies]
# The golden snapshots render the domains' own test corpora, which are behind a
# feature so a release build compiles neither of them.
ah-domains = { path = "crates/ah-domains", features = ["fixtures"] }
# This package, for its own `harness` feature: `tests/` is a separate crate and
# cannot see a `cfg(test)` module.
aihelper = { path = ".", features = ["harness"] }
ah-release-manifest = { path = "crates/ah-release-manifest" }
assert_cmd.workspace = true
base64.workspace = true
# The log rotation test takes the same lock the event log does.
fs2.workspace = true
# The managed-service integration tests build definitions by hand.
uuid.workspace = true
command-group.workspace = true
predicates = "3.1.3"

[[bin]]
name = "ah"
path = "src/main.rs"
