[package]
name = "ah-plugin-ollama"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dynamic AIHelper plugin for Ollama Local API"
# Distributed as signed binaries, not on crates.io. Publishing would also
# require versioned path dependencies across the workspace.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ah-plugin-api = { path = "../../crates/ah-plugin-api" }
ah-plugin-sdk = { path = "../../crates/ah-plugin-sdk" }
clap.workspace = true
reqwest = { workspace = true, features = ["json"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
