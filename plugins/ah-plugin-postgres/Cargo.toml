[package]
name = "ah-plugin-postgres"
version = "2.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dynamic AIHelper plugin for PostgreSQL database workflows"
# Distributed as signed binaries, not on crates.io. Publishing would also
# require versioned path dependencies across the workspace.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ah-paths = { path = "../../crates/ah-paths" }
ah-platform = { path = "../../crates/ah-platform" }
ah-plugin-api = { path = "../../crates/ah-plugin-api" }
ah-plugin-sdk = { path = "../../crates/ah-plugin-sdk" }
clap.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
